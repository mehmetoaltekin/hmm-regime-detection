[build-system]
requires = ["setuptools>=77"]               # license as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "hmm-regime-detection"
dynamic = ["version"]
description = "Walk-forward Gaussian HMM market regime detection with causal forward filtering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Altekin" }]
keywords = ["hidden markov model", "regime detection", "walk-forward", "volatility", "quantitative finance"]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "hmmlearn>=0.3.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]        # fetch_returns()
plot = ["matplotlib>=3.7.0"]       # examples/demo.py
dev = ["pytest>=7.0.0", "matplotlib>=3.7.0"]

[project.urls]
Repository = "https://github.com/mehmetoaltekin/hmm-regime-detection"

[tool.setuptools]
packages = ["hmm_regime"]          # src/ is a compatibility layer for checkouts, not installed

[tool.setuptools.dynamic]
version = { attr = "hmm_regime.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
