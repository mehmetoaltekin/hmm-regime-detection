name: Quantitative Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Look-Ahead Invariance & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Biri hata alsa bile diğer Python sürümleri iptal edilmez
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Look-Ahead & Alignment Assertions
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Installed package works outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -c "import hmm_regime, sys; print(hmm_regime.__version__); from hmm_regime import WalkForwardHMM, prepare_hmm_features, add_filtered_regime"

      - name: Run the demo
        env:
          PYTHONPATH: .
        run: |
          python examples/demo.py
