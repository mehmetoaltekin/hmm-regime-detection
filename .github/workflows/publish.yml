name: Publish to PyPI

# Push a tag such as v0.2.0 to publish that version to PyPI.
# Run the workflow by hand (Actions tab -> Publish to PyPI -> Run workflow)
# to publish to TestPyPI instead, as a rehearsal.
#
# Uses PyPI trusted publishing: no API token is stored in the repository.
# One-time setup is described in RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' hmm_regime/__init__.py)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match hmm_regime.__version__ = $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test the built wheel outside the checkout
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl pytest
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          # the tests of the src/ compatibility layer need a checkout; skip them here
          /tmp/venv/bin/python -m pytest tests -q -k "not src_imports"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hmm-regime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hmm-regime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
